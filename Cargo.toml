[package]
name = "shop_rocket_api"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
argon2 = "0.5.3"
dotenvy = "0.15.7"
jsonwebtoken = "9.3.0"
rand = "0.9.2"
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio-rustls", "macros"] }
thiserror = "2.0.17"
utoipa = { version = "4.2" }
utoipa-swagger-ui = { version = "6.0", features = ["rocket"] }
